<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F3FAFA" />
    <meta
      name="description"
      content="Poseidon — a beautiful personal atlas of your underwater life."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%assets/brand/startup/splash-still.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%BASE_URL%icons/favicon-32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="%BASE_URL%icons/favicon-64.png"
    />
    <title>Poseidon</title>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" aria-label="Opening Poseidon">
        <span>Poseidon</span>
        <small>Your underwater life</small>
      </div>
    </div>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }
      .boot-shell {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        background: #06181f;
        color: #f3fafa;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        text-transform: uppercase;
      }
      .boot-shell span {
        font-size: 1.45rem;
        font-weight: 850;
        letter-spacing: 0.32em;
        text-indent: 0.32em;
      }
      .boot-shell small {
        color: rgb(243 250 250 / 0.58);
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
