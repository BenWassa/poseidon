name: Issue 33 butterfish batch finalize

on:
  push:
    branches:
      - feat/33-art-batch-butterfish

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/33-art-batch-butterfish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: npx playwright install --with-deps chromium

      - name: Record reviewed #33 metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from PIL import Image

          catalog_path = Path('assets/source/creatures/catalog.json')
          catalog = json.loads(catalog_path.read_text())
          assert catalog['summary'] == {'total': 30, 'keep': 30, 'provisional': 0, 'remake': 0}, catalog['summary']
          assert catalog['binaryImportStatus'] == 'complete'
          assert catalog['styleFamily'] == 'poseidon-sunlit-square-v1'

          review = {
              'banded-butterflyfish': {
                  'name': 'Banded butterflyfish',
                  'score': 8.4,
                  'note': 'Issue #33 reviewed keep: disc-like silver butterflyfish with four broad black vertical bars and no rear ocellus; the foureye-butterflyfish false-eye pattern is explicitly absent and the silhouette remains legible at card scale.',
              },
              'bar-jack': {
                  'name': 'Bar jack',
                  'score': 8.2,
                  'note': 'Issue #33 reviewed keep: silver/light-blue streamlined jack with a strongly forked tail; blue upper-body stripe and adjacent black stripe remain visible into the tail treatment at card scale.',
              },
              'blue-chromis': {
                  'name': 'Blue chromis',
                  'score': 8.3,
                  'note': 'Issue #33 reviewed keep: dark electric-blue elongate oval with a deeply forked pointed tail and explicit dark upper/lower tail and fin margins; reads distinctly from deeper-bodied damselfish.',
              },
              'bluestriped-grunt': {
                  'name': 'Bluestriped grunt',
                  'score': 8.5,
                  'note': 'Issue #33 reviewed keep: yellow grunt body with strong blue longitudinal striping plus dark caudal and soft-dorsal treatment; the cues remain clear at collection-card scale.',
              },
              'hogfish': {
                  'name': 'Hogfish',
                  'score': 8.1,
                  'note': 'Issue #33 reviewed keep: pale terminal-male presentation with deep oblong body, long pointed snout, first three dorsal spines extended as filaments, and dark forehead/nape and tail-base markings.',
              },
              'queen-parrotfish': {
                  'name': 'Queen parrotfish',
                  'score': 8.1,
                  'note': 'Issue #33 reviewed keep: terminal-phase queen parrotfish with blue mouth/muzzle treatment, oblique blue eye-to-mid-back stripe and a clearly pink-edged tail; kept visually distinct from princess parrotfish.',
              },
              'sharpnose-puffer': {
                  'name': 'Sharpnose puffer',
                  'score': 8.4,
                  'note': 'Issue #33 reviewed keep: long pointed snout, brown upper/yellowish lower body, thin blue eye/snout lines and blue body spots, plus a yellow tail with broad dark upper/lower margins and pale central base.',
              },
          }

          existing = {entry['id'] for entry in catalog['assets']}
          for creature_id in review:
              assert creature_id not in existing, f'{creature_id} already cataloged; refusing overlapping #33 ownership'

          for creature_id, meta in review.items():
              path = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              data = path.read_bytes()
              with Image.open(path) as image:
                  assert image.size == (1024, 1024), (creature_id, image.size)
                  assert image.format == 'WEBP', (creature_id, image.format)
                  assert image.mode == 'RGB', (creature_id, image.mode)
                  card = image.resize((192, 192), Image.Resampling.LANCZOS)
                  assert card.getbbox() is not None
              catalog['assets'].append({
                  'id': creature_id,
                  'creatureId': creature_id,
                  'name': meta['name'],
                  'path': path.as_posix(),
                  'score': meta['score'],
                  'status': 'keep',
                  'identity': 'high',
                  'ingestMode': 'opaque-scene',
                  'qaNote': meta['note'],
                  'generatedOn': '2026-09-14',
                  'generationBatch': 'issue-33-butterfish-2026-09-14',
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
              print(creature_id, len(data), hashlib.sha256(data).hexdigest())

          catalog['updatedOn'] = '2026-09-14'
          catalog['summary'] = {
              'total': len(catalog['assets']),
              'keep': sum(a['status'] == 'keep' for a in catalog['assets']),
              'provisional': sum(a['status'] == 'provisional' for a in catalog['assets']),
              'remake': sum(a['status'] == 'remake' for a in catalog['assets']),
          }
          assert catalog['summary'] == {'total': 37, 'keep': 37, 'provisional': 0, 'remake': 0}, catalog['summary']
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')
          PY

      - name: Strict source validation and guarded promotion
        run: |
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json
          for id in banded-butterflyfish bar-jack blue-chromis bluestriped-grunt hogfish queen-parrotfish sharpnose-puffer; do
            python -m tools.creature_assets promote-source --candidate "$id" --force
          done
          python -m tools.creature_assets validate --root assets/creatures

      - name: Verify runtime variants and web mount
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          ids = ['banded-butterflyfish','bar-jack','blue-chromis','bluestriped-grunt','hogfish','queen-parrotfish','sharpnose-puffer']
          catalog = json.loads(Path('assets/source/creatures/catalog.json').read_text())
          entries = {entry['id']: entry for entry in catalog['assets']}
          for creature_id in ids:
              root = Path('assets/creatures') / creature_id
              manifest = json.loads((root / 'manifest.json').read_text())
              assert manifest['creatureId'] == creature_id
              assert manifest['artwork']['status'] == 'curated'
              assert manifest['source']['mode'] == 'opaque-scene'
              assert manifest['source']['sha256'] == entries[creature_id]['sha256']
              for key, expected in [('thumb',192),('gallery',512),('hero',1024)]:
                  path = root / f'{key}.webp'
                  assert path.is_file(), (creature_id, key)
                  variant = manifest['artwork']['variants'][key]
                  assert variant['width'] == expected and variant['height'] == expected
                  assert variant['sha256'] == hashlib.sha256(path.read_bytes()).hexdigest()
              print(creature_id, 'runtime-ok')
          PY
          npm run assets:sync
          python - <<'PY'
          from pathlib import Path
          ids = ['banded-butterflyfish','bar-jack','blue-chromis','bluestriped-grunt','hogfish','queen-parrotfish','sharpnose-puffer']
          for creature_id in ids:
              root = Path('apps/web/public/assets/creatures') / creature_id
              for filename in ('thumb.webp','gallery.webp','hero.webp','manifest.json'):
                  assert (root / filename).is_file(), (creature_id, filename)
              print(creature_id, 'web-mount-ok')
          PY

      - name: Full repository gate
        env:
          POSEIDON_BASE_PATH: /poseidon/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run gate

      - name: Remove temporary workflow and commit accepted batch
        run: |
          rm .github/workflows/issue33-butterfish-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures assets/creatures .github/workflows/issue33-butterfish-finalize.yml
          git commit -m 'feat(assets): add isolated #33 butterfish batch'
          git push origin HEAD:feat/33-art-batch-butterfish
