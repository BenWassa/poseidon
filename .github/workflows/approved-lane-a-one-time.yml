name: Publish approved Lane A candidates (one-time)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/approved-lane-a-one-time.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'art/issue-62-approved-normalization-20261023' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - name: Install pinned image codec
        run: python -m pip install -r tools/creature_assets/requirements.txt
      - name: Convert exact approved v3 source files, commit separately, and publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for species in loggerhead-sea-turtle caribbean-reef-octopus spotted-moray black-grouper splendid-toadfish; do
            export SPECIES="$species"
            source="assets/source/creatures/${species}/candidate-v3.webp"
            target="assets/source/creatures/${species}/candidate-v4.webp"
            if test -e "$target"; then
              echo "::error::Target already exists: $target"; exit 1
            fi
            python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from PIL import Image
          import os

          species = os.environ["SPECIES"]
          src = Path("assets/source/creatures") / species / "candidate-v3.webp"
          dst = src.with_name("candidate-v4.webp")
          original_bytes = src.read_bytes()
          with Image.open(src) as input_image:
              input_image.load()
              assert input_image.format == "WEBP", (species, input_image.format)
              assert input_image.size == (1254, 1254), (species, input_image.size)
              assert "A" not in input_image.getbands(), (species, input_image.mode)
              normalized = input_image.convert("RGB").resize((1024, 1024), Image.Resampling.LANCZOS)
              normalized.save(dst, format="WEBP", lossless=True, method=6)
          with Image.open(dst) as check:
              check.load()
              assert check.format == "WEBP"
              assert check.size == (1024, 1024)
              assert check.mode == "RGB"
          assert src.read_bytes() == original_bytes, "Historical immutable source changed"
          print(f"{species}: source={sha256(original_bytes).hexdigest()} normalized={sha256(dst.read_bytes()).hexdigest()} bytes={dst.stat().st_size}")
          PY
            git add "$target"
            git commit -m "art: add ${species} approved candidate v4"
          done
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "Five approved normalized candidates published as five independent commits" >> "$GITHUB_STEP_SUMMARY"
