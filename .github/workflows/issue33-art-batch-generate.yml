name: Issue 33 isolated art batch generation

on:
  push:
    branches:
      - feat/33-art-batch-adpy

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/33-art-batch-adpy
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: python -m pip install -r tools/creature_assets/requirements.txt cairosvg
      - name: Render seven locked #33 species
        run: python tools/issue33_art_render.py
      - name: Encode immutable 1024 WebP source candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          ids = [
              'balloonfish',
              'black-grouper',
              'doctorfish',
              'foureye-butterflyfish',
              'princess-parrotfish',
              'spotted-moray',
              'yellowtail-damselfish',
          ]
          for creature_id in ids:
              src = Path('tmp_issue33_art_batch') / f'{creature_id}.png'
              dst = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              if dst.exists():
                  raise SystemExit(f'refusing to overwrite immutable source candidate: {dst}')
              dst.parent.mkdir(parents=True, exist_ok=False)
              with Image.open(src) as image:
                  assert image.size == (1024, 1024), (creature_id, image.size)
                  image.convert('RGB').save(dst, 'WEBP', quality=90, method=6, exact=True)
              with Image.open(dst) as image:
                  assert image.size == (1024, 1024)
                  assert image.format == 'WEBP'
                  assert 'A' not in image.getbands()
              print(dst, dst.stat().st_size)
          PY
      - name: Remove temporary generation machinery
        run: |
          rm -rf tmp_issue33_art_batch tools/issue33_art_render.py .github/workflows/issue33-art-batch-generate.yml
      - name: Commit source candidates only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures .github/workflows/issue33-art-batch-generate.yml tools/issue33_art_render.py
          git commit -m 'assets: stage #33 isolated source candidates'
          git push origin HEAD:feat/33-art-batch-adpy
