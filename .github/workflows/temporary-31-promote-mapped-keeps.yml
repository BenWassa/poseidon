name: Temporary #31 mapped keep promotion

on:
  push:
    branches:
      - feat/31-promote-newly-mapped-keeps

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/31-promote-newly-mapped-keeps
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset pipeline dependencies
        run: python -m pip install -r tools/creature_assets/requirements.txt

      - name: Promote newly mapped approved candidates
        run: |
          python -m tools.creature_assets promote-source --candidate queen-triggerfish
          python -m tools.creature_assets promote-source --candidate longspine-sea-urchin
          python -m tools.creature_assets promote-source --candidate banded-coral-shrimp
          python -m tools.creature_assets promote-source --candidate juvenile-spotted-drum

      - name: Validate runtime and source assets
        run: |
          python -m tools.creature_assets validate --root assets/creatures
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json

      - name: Commit generated runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/creatures
          git diff --cached --exit-code && { echo "No generated asset changes found"; exit 1; } || true
          git commit -m "feat(assets): promote four newly mapped HD creatures"
          git push origin HEAD:feat/31-promote-newly-mapped-keeps
