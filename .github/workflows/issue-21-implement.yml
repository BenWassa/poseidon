name: Issue 21 implementation

on:
  push:
    branches: [brand-21-sunlit-reef]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'brand-21-sunlit-reef'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-21-sunlit-reef
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - name: Install creature asset validator dependencies
        run: python -m pip install -r tools/creature_assets/requirements.txt
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Remove redundant migration assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/issue21-migrate.mjs')
          text = path.read_text()
          block = """for (const path of ['apps/web/src/screens/Journal.tsx', 'apps/web/src/screens/CreatureDetail.tsx']) {
            await update(path, (content) => content.replaceAll('text-marine uppercase', 'text-abyss/70 uppercase'));
          }

          """
          if block not in text:
              raise SystemExit('expected redundant assertion block not found')
          path.write_text(text.replace(block, ''))
          PY
      - name: Apply Sunlit Reef migration
        run: node tools/issue21-migrate.mjs
      - name: Repair generated brand regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/web/test/brand.test.ts')
          text = path.read_text()
          text = text.replace(".join('\n')", r".join('\n')")
          text = text.replace("const here = fileURLToPath(new URL('.', import.meta.url));\n", "")
          path.write_text(text)
          PY
      - name: Format source
        run: npm run format
      - name: Regenerate current icon
        run: npm run brand:build
      - name: Remove migration machinery
        run: rm tools/issue21-migrate.mjs .github/workflows/issue-21-implement.yml
      - name: Commit focused migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate Poseidon to Sunlit Reef brand system"
          git push origin HEAD:brand-21-sunlit-reef
      - name: Full repository gate
        env:
          POSEIDON_BASE_PATH: /poseidon/
        run: npm run gate
