name: Issue 33 final six art generation

on:
  push:
    branches:
      - feat/33-art-batch-bluehead-loggerhead

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/33-art-batch-bluehead-loggerhead
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: python -m pip install CairoSVG==2.7.1
      - run: npx playwright install --with-deps chromium

      - name: Render diagnostic-led final candidates
        run: python tools/issue33_final_render.py

      - name: Encode immutable 1024 WebP source candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          ids = [
              'bluehead-wrasse',
              'loggerhead-sea-turtle',
              'ocean-surgeonfish',
              'rock-beauty',
              'splendid-toadfish',
              'yellowhead-wrasse',
          ]
          for creature_id in ids:
              src = Path('tmp_issue33_final') / f'{creature_id}.png'
              dst = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              if dst.exists():
                  raise SystemExit(f'refusing to overwrite immutable source candidate: {dst}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as image:
                  if image.size != (1024, 1024):
                      raise SystemExit(f'wrong rendered size for {creature_id}: {image.size}')
                  image.convert('RGB').save(dst, 'WEBP', quality=90, method=6, exact=True)
              with Image.open(dst) as image:
                  assert image.size == (1024, 1024)
                  assert image.format == 'WEBP'
                  assert 'A' not in image.getbands()
              print(dst, dst.stat().st_size)
          PY

      - name: Register reviewed keep candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          catalog_path = Path('assets/source/creatures/catalog.json')
          catalog = json.loads(catalog_path.read_text())
          specs = [
              {
                  'id': 'bluehead-wrasse',
                  'name': 'Bluehead wrasse',
                  'score': 8.7,
                  'qaNote': 'Issue #33 reviewed keep: terminal-phase elongated wrasse with vivid blue head and green body separated by strong black and white vertical bars; remains unmistakable at card scale.',
              },
              {
                  'id': 'loggerhead-sea-turtle',
                  'name': 'Loggerhead sea turtle',
                  'score': 8.7,
                  'qaNote': 'Issue #33 reviewed keep: conspicuously large blunt head and powerful jaws, reddish-brown hard heart-shaped carapace, five paired costal scutes and a pale plastron glimpse distinguish Caretta caretta from green and hawksbill turtles.',
              },
              {
                  'id': 'ocean-surgeonfish',
                  'name': 'Ocean surgeonfish',
                  'score': 8.5,
                  'qaNote': 'Issue #33 reviewed keep: uniform grey-brown compressed surgeonfish body has no doctorfish vertical bars, retains short yellow lines behind the eye, and uses a pointed concave tail with a narrow pale trailing edge.',
              },
              {
                  'id': 'rock-beauty',
                  'name': 'Rock beauty',
                  'score': 8.7,
                  'qaNote': 'Issue #33 reviewed keep: adult yellow head/front contrasts with the black rear body and dark dorsal/front anal treatment; the tail remains entirely yellow with orange margin and blue-iris accents.',
              },
              {
                  'id': 'splendid-toadfish',
                  'name': 'Splendid toadfish',
                  'score': 8.8,
                  'qaNote': 'Issue #33 reviewed keep: broad black head carries white zebra-like lines, grey body retains pale mesh, dark fins have broad orange/yellow edges, and numerous jaw barbels include only the central pair as visibly branched.',
              },
              {
                  'id': 'yellowhead-wrasse',
                  'name': 'Yellowhead wrasse',
                  'score': 8.6,
                  'qaNote': 'Issue #33 reviewed keep: terminal-phase elongated wrasse preserves a yellow head/front body and prominent dark T/bar beneath the dorsal-origin area, remaining distinct from bluehead and yellowcheek wrasses at card scale.',
              },
          ]
          existing = {entry['id'] for entry in catalog['assets']}
          if existing.intersection(spec['id'] for spec in specs):
              raise SystemExit('one or more final-six catalog IDs already exist; refusing duplicate registration')
          if catalog['summary'] != {'total': 50, 'keep': 50, 'provisional': 0, 'remake': 0}:
              raise SystemExit(f"unexpected starting catalog summary: {catalog['summary']}")

          for spec in specs:
              creature_id = spec['id']
              path = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              data = path.read_bytes()
              catalog['assets'].append({
                  'id': creature_id,
                  'creatureId': creature_id,
                  'name': spec['name'],
                  'path': path.as_posix(),
                  'score': spec['score'],
                  'status': 'keep',
                  'identity': 'high',
                  'ingestMode': 'opaque-scene',
                  'qaNote': spec['qaNote'],
                  'generator': 'ChatGPT procedural SVG renderer',
                  'generatedOn': '2026-09-15',
                  'generationBatch': 'issue-33-final-six-2026-09-15',
                  'styleFamily': 'poseidon-sunlit-square-v1',
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })

          catalog['updatedOn'] = '2026-09-15'
          catalog['summary'] = {
              'total': len(catalog['assets']),
              'keep': sum(entry['status'] == 'keep' for entry in catalog['assets']),
              'provisional': sum(entry['status'] == 'provisional' for entry in catalog['assets']),
              'remake': sum(entry['status'] == 'remake' for entry in catalog['assets']),
          }
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')
          print(catalog['summary'])
          PY

      - name: Strict source validation
        run: python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json

      - name: Guarded promotion
        run: |
          for id in bluehead-wrasse loggerhead-sea-turtle ocean-surgeonfish rock-beauty splendid-toadfish yellowhead-wrasse; do
            python -m tools.creature_assets promote-source --candidate "$id"
          done

      - name: Verify 56 by 56 by 56 completion invariant
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          content_ids = set()
          for path in sorted(Path('content').glob('**/creatures/*.json')):
              payload = json.loads(path.read_text())
              for creature in payload.get('creatures', []):
                  content_ids.add(creature['id'])

          catalog = json.loads(Path('assets/source/creatures/catalog.json').read_text())
          keeps = [entry for entry in catalog['assets'] if entry['status'] == 'keep' and isinstance(entry.get('creatureId'), str)]
          mapped_ids = [entry['creatureId'] for entry in keeps]
          runtime_ids = {path.parent.name for path in Path('assets/creatures').glob('*/manifest.json')}

          assert len(content_ids) == 56, len(content_ids)
          assert len(keeps) == 56, len(keeps)
          assert len(mapped_ids) == len(set(mapped_ids)) == 56
          assert set(mapped_ids) == content_ids
          assert len(runtime_ids) == 56, len(runtime_ids)
          assert runtime_ids == content_ids
          assert catalog['summary'] == {'total': 56, 'keep': 56, 'provisional': 0, 'remake': 0}
          print('Issue #33 completion audit: 56 content IDs = 56 mapped keep source entries = 56 canonical runtime manifests')
          PY

      - name: Validate canonical runtime assets
        run: python -m tools.creature_assets validate --root assets/creatures

      - name: Full repository gate
        run: npm run gate

      - name: Verify rendered runtime surfaces
        run: node tools/issue33_final_verify_render.mjs

      - name: Remove temporary generation machinery
        run: |
          rm -rf tmp_issue33_final
          rm tools/issue33_final_render.py tools/issue33_final_verify_render.mjs .github/workflows/issue33-final-six-generate.yml

      - name: Commit final six source and runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures assets/creatures tools/issue33_final_render.py tools/issue33_final_verify_render.mjs .github/workflows/issue33-final-six-generate.yml
          git commit -m 'assets: complete #33 final six coverage'
          git push origin HEAD:feat/33-art-batch-bluehead-loggerhead
