name: Temporary #38 promote eagle-ray candidate

on:
  push:
    branches:
      - feat/38-remake-batch-a

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/38-remake-batch-a
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset pipeline dependencies
        run: python -m pip install -r tools/creature_assets/requirements.txt

      - name: Approve immutable spotted eagle ray v2 in source catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/source/creatures/catalog.json')
          data = json.loads(p.read_text())
          entry = next(x for x in data['assets'] if x['id'] == 'spotted-eagle-ray')
          assert entry['status'] == 'remake'
          assert entry['path'].endswith('candidate-v1.webp')
          entry.update({
              'path': 'assets/source/creatures/spotted-eagle-ray/candidate-v2.webp',
              'score': 7.8,
              'status': 'keep',
              'identity': 'high',
              'ingestMode': 'opaque-scene',
              'qaNote': 'Replacement v2: eagle-ray disc/head silhouette and dense white dorsal spotting read clearly at card scale; long whip tail is explicit. Composite source uses an AI-generated specimen isolated into the established sunlit Caribbean scene treatment.',
              'bytes': 17710,
              'sha256': '0f8e4f5df8a99021dff15b5b4dcbb0d3db6ae2f3dce15baeabab5007b02a24aa',
          })
          data['updatedOn'] = '2026-09-12'
          data['summary']['keep'] = 23
          data['summary']['remake'] = 7
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate source and promote through guarded path
        run: |
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json
          python -m tools.creature_assets promote-source --candidate spotted-eagle-ray --force
          python -m tools.creature_assets validate --root assets/creatures
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json

      - name: Remove temporary workflow
        run: rm .github/workflows/temporary-38-promote-eagle-ray.yml

      - name: Commit reviewed candidate promotion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): approve spotted eagle ray v2"
          git push origin HEAD:feat/38-remake-batch-a
