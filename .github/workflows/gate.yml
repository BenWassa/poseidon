name: Repository gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - name: Install creature asset validator dependencies
        run: python -m pip install -r tools/creature_assets/requirements.txt
      - name: Install Chromium for production acceptance
        run: npx playwright install --with-deps chromium
      - name: Full repository gate
        env:
          POSEIDON_BASE_PATH: /poseidon/
        run: npm run gate
