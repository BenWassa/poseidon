name: Repository gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - name: Install creature asset validator dependencies
        run: python -m pip install -r tools/creature_assets/requirements.txt
      - name: Validate marine content
        run: npm run validate:content
      - name: Validate creature assets
        run: npm run validate:assets
      - name: Typecheck domain and application
        run: npm run typecheck
      - name: Test domain and application
        run: npm test
      - name: Production build
        env:
          POSEIDON_BASE_PATH: /poseidon/
        run: npm run build
      - name: Install Chromium for production acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify production PWA field readiness
        env:
          POSEIDON_BASE_PATH: /poseidon/
        run: npm run verify:field --workspace @poseidon/web
