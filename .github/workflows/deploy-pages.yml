name: Deploy Poseidon PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Typecheck domain and application
        run: npm run typecheck
      - name: Test domain and application
        run: npm test
      - name: Install Chromium for production acceptance
        run: npx playwright install --with-deps chromium
      - name: Build production PWA for project Pages
        env:
          POSEIDON_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
      - name: Verify production PWA at deployment base path
        env:
          POSEIDON_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run verify:field --workspace @poseidon/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
