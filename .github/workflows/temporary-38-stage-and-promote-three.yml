name: Temporary #38 stage and promote remaining Batch A

on:
  push:
    branches:
      - feat/38-remake-batch-a

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/38-remake-batch-a
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install asset pipeline dependencies
        run: python -m pip install -r tools/creature_assets/requirements.txt

      - name: Reconstruct candidate archive
        run: |
          cat .tmp/38/three-1.b64 .tmp/38/three-2.b64 .tmp/38/three-3.b64 .tmp/38/three-4.b64 .tmp/38/three-5.b64 .tmp/38/three-6.b64 | base64 --decode > /tmp/remake-batch-a-three.zip
          test "$(wc -c < /tmp/remake-batch-a-three.zip)" = "41174"
          sha256sum /tmp/remake-batch-a-three.zip
          rm -rf /tmp/remake-batch-a-three
          mkdir -p /tmp/remake-batch-a-three
          unzip -q /tmp/remake-batch-a-three.zip -d /tmp/remake-batch-a-three
          mkdir -p assets/source/creatures/spotted-trunkfish assets/source/creatures/blue-tang assets/source/creatures/spanish-hogfish
          cp /tmp/remake-batch-a-three/spotted-trunkfish/candidate-v2.webp assets/source/creatures/spotted-trunkfish/candidate-v2.webp
          cp /tmp/remake-batch-a-three/blue-tang/candidate-v2.webp assets/source/creatures/blue-tang/candidate-v2.webp
          cp /tmp/remake-batch-a-three/spanish-hogfish/candidate-v2.webp assets/source/creatures/spanish-hogfish/candidate-v2.webp

      - name: Verify candidate binaries
        run: |
          echo "c5c802f813bc181341a7b9a71b64edd7f70cc8e505c3b62d179e4e7a30982968  assets/source/creatures/spotted-trunkfish/candidate-v2.webp" | sha256sum -c -
          echo "95a78123f860742551754c0b896accbf3c14c20c87cd8f283ab696766b80b540  assets/source/creatures/blue-tang/candidate-v2.webp" | sha256sum -c -
          echo "4403f5fcf8ea21d2c91a161b23fd9c534e28b2171d5a8f66a90be597f0bd0ba3  assets/source/creatures/spanish-hogfish/candidate-v2.webp" | sha256sum -c -
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          expected = {
              'spotted-trunkfish': 20562,
              'blue-tang': 7924,
              'spanish-hogfish': 12248,
          }
          for creature, size in expected.items():
              p = Path(f'assets/source/creatures/{creature}/candidate-v2.webp')
              assert p.stat().st_size == size, (creature, p.stat().st_size)
              with Image.open(p) as im:
                  im.load()
                  assert im.format == 'WEBP', (creature, im.format)
                  assert im.size == (1024, 1024), (creature, im.size)
                  assert 'A' not in im.getbands(), (creature, im.getbands())
          PY

      - name: Approve reviewed Batch A candidates in source catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('assets/source/creatures/catalog.json')
          data = json.loads(p.read_text())
          updates = {
              'spotted-trunkfish': {
                  'path': 'assets/source/creatures/spotted-trunkfish/candidate-v2.webp',
                  'score': 7.6,
                  'status': 'keep',
                  'identity': 'high',
                  'qaNote': 'Replacement v2: adult reads pale/whitish with dense dark spots and no pre-eye horns; the prior inverted dark-body/white-spot failure is removed. AI-generated specimen was pattern-corrected and isolated into the established sunlit Caribbean scene treatment.',
                  'bytes': 20562,
                  'sha256': 'c5c802f813bc181341a7b9a71b64edd7f70cc8e505c3b62d179e4e7a30982968',
              },
              'blue-tang': {
                  'path': 'assets/source/creatures/blue-tang/candidate-v2.webp',
                  'score': 7.6,
                  'status': 'keep',
                  'identity': 'high',
                  'qaNote': 'Replacement v2: Atlantic Acanthurus coeruleus presentation with a deep compressed blue surgeonfish body, fine flank lines and blue tail; the Indo-Pacific Paracanthurus black/yellow palette is explicitly removed. AI-generated specimen was identity-corrected and isolated into the established scene treatment.',
                  'bytes': 7924,
                  'sha256': '95a78123f860742551754c0b896accbf3c14c20c87cd8f283ab696766b80b540',
              },
              'spanish-hogfish': {
                  'path': 'assets/source/creatures/spanish-hogfish/candidate-v2.webp',
                  'score': 7.4,
                  'status': 'keep',
                  'identity': 'medium',
                  'qaNote': 'Replacement v2: adult Bodianus rufus identification is carried by the robust hogfish form plus the explicit lilac/blue-grey upper and yellow lower-body division; generic red-wrasse coloration is removed. Identity remains medium because the corrected source is intentionally stylized.',
                  'bytes': 12248,
                  'sha256': '4403f5fcf8ea21d2c91a161b23fd9c534e28b2171d5a8f66a90be597f0bd0ba3',
              },
          }
          for candidate, patch in updates.items():
              entry = next(x for x in data['assets'] if x['id'] == candidate)
              assert entry['status'] == 'remake', candidate
              assert entry['path'].endswith('candidate-v1.webp'), candidate
              patch['ingestMode'] = 'opaque-scene'
              entry.update(patch)
          data['updatedOn'] = '2026-09-12'
          data['summary']['keep'] = 26
          data['summary']['remake'] = 4
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Validate source and promote through guarded path
        run: |
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json
          python -m tools.creature_assets promote-source --candidate spotted-trunkfish --force
          python -m tools.creature_assets promote-source --candidate blue-tang --force
          python -m tools.creature_assets promote-source --candidate spanish-hogfish --force
          python -m tools.creature_assets validate --root assets/creatures
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json

      - name: Remove transfer scaffolding
        run: |
          rm -rf .tmp/38
          rm .github/workflows/temporary-38-stage-and-promote-three.yml

      - name: Commit Batch A source and runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(assets): complete #38 remake batch A"
          git push origin HEAD:feat/38-remake-batch-a
