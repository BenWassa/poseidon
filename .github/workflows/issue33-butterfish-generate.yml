name: Issue 33 butterfish batch generation

on:
  push:
    branches:
      - feat/33-art-batch-butterfish

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/33-art-batch-butterfish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Render reviewed #33 source masters
        run: node tools/issue33_butterfish_render.mjs
      - name: Encode immutable 1024 WebP candidates and verify card scale
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat

          ids = [
              'banded-butterflyfish',
              'bar-jack',
              'blue-chromis',
              'bluestriped-grunt',
              'hogfish',
              'queen-parrotfish',
              'sharpnose-puffer',
          ]
          for creature_id in ids:
              src = Path('tmp_issue33_butterfish') / f'{creature_id}.png'
              dst = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              dst.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as image:
                  assert image.size == (1024, 1024)
                  rgb = image.convert('RGB')
                  rgb.save(dst, 'WEBP', quality=90, method=6, exact=True)
                  card = rgb.resize((192, 192), Image.Resampling.LANCZOS)
                  extrema = card.getextrema()
                  assert all(lo < hi for lo, hi in extrema), (creature_id, extrema)
                  assert sum(ImageStat.Stat(card).stddev) > 30, creature_id
              with Image.open(dst) as image:
                  assert image.size == (1024, 1024)
                  assert image.format == 'WEBP'
                  assert image.mode == 'RGB'
              print(dst, dst.stat().st_size)
          PY
      - name: Remove temporary generation machinery
        run: |
          rm -rf tmp_issue33_butterfish tools/issue33_butterfish_render.mjs .github/workflows/issue33-butterfish-generate.yml
      - name: Commit source candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures .github/workflows/issue33-butterfish-generate.yml tools/issue33_butterfish_render.mjs
          git commit -m 'assets: stage #33 butterfish batch source candidates'
          git push origin HEAD:feat/33-art-batch-butterfish
