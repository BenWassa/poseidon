name: Issue 33 isolated art batch finalize

on:
  push:
    branches:
      - feat/33-art-batch-adpy

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/33-art-batch-adpy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Record accepted source metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          from PIL import Image

          catalog_path = Path('assets/source/creatures/catalog.json')
          catalog = json.loads(catalog_path.read_text())
          if any(a['id'] in {
              'balloonfish','black-grouper','doctorfish','foureye-butterflyfish',
              'princess-parrotfish','spotted-moray','yellowtail-damselfish'
          } for a in catalog['assets']):
              raise SystemExit('one or more isolated batch entries already exist in source catalog')

          review = {
              'balloonfish': {
                  'name': 'Balloonfish', 'scientificName': 'Diodon holocanthus', 'score': 8.1,
                  'qaNote': 'Accepted at full and card scale: robust inflated porcupinefish form; numerous long erectile spines longer than the eye; dark eye bar; broad dark body blotches with sparse spots; unspotted fins and no spines on the tail base.'
              },
              'black-grouper': {
                  'name': 'Black grouper', 'scientificName': 'Mycteroperca bonaci', 'score': 8.0,
                  'qaNote': 'Accepted at full and card scale: robust grouper form with rectangular dark-grey flank blotches and black outer thirds on second dorsal, anal and caudal fins; avoids uniform-black and Nassau-grouper bar treatments.'
              },
              'doctorfish': {
                  'name': 'Doctorfish', 'scientificName': 'Acanthurus chirurgus', 'score': 8.2,
                  'qaNote': 'Accepted at full and card scale: grey-brown compressed surgeonfish body with ten long thin dark vertical bars and a blunt, nearly straight/slightly concave tail without a narrow white rear edge.'
              },
              'foureye-butterflyfish': {
                  'name': 'Foureye butterflyfish', 'scientificName': 'Chaetodon capistratus', 'score': 8.3,
                  'qaNote': 'Accepted at full and card scale: cream disc-like butterflyfish with thin chevron flank lines, short pointed snout and one large rear ocellus below the dorsal; distinct from banded butterflyfish.'
              },
              'princess-parrotfish': {
                  'name': 'Princess parrotfish', 'scientificName': 'Scarus taeniopterus', 'score': 7.9,
                  'qaNote': 'Accepted terminal-phase treatment at full and card scale: blue chest, blue dorsal with pink centre, pink upper/lower tail edges and yellow stripe above the pectoral; avoids a generic green parrotfish presentation.'
              },
              'spotted-moray': {
                  'name': 'Spotted moray', 'scientificName': 'Gymnothorax moringa', 'score': 8.2,
                  'qaNote': 'Accepted at full and card scale: eel-like pale yellow/cream body with many distinct small round dark brown spots; avoids green-moray colour and large irregular blotches.'
              },
              'yellowtail-damselfish': {
                  'name': 'Yellowtail damselfish', 'scientificName': 'Microspathodon chrysurus', 'score': 8.2,
                  'qaNote': 'Accepted adult treatment at full and card scale: deep robust brown damselfish body, bright yellow caudal fin and blue spots concentrated on the upper body.'
              },
          }

          for creature_id, meta in review.items():
              path = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              data = path.read_bytes()
              with Image.open(path) as image:
                  image.load()
                  assert image.size == (1024, 1024), (creature_id, image.size)
                  assert image.format == 'WEBP', (creature_id, image.format)
                  assert 'A' not in image.getbands(), creature_id
              catalog['assets'].append({
                  'id': creature_id,
                  'creatureId': creature_id,
                  'name': meta['name'],
                  'scientificName': meta['scientificName'],
                  'path': path.as_posix(),
                  'score': meta['score'],
                  'status': 'keep',
                  'identity': 'high',
                  'ingestMode': 'opaque-scene',
                  'qaNote': meta['qaNote'],
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'provenance': {
                      'generator': 'ChatGPT assisted vector generation',
                      'generatedOn': '2026-09-14',
                      'batch': 'issue-33-isolated-art-batch-adpy',
                      'styleFamily': 'poseidon-sunlit-square-v1'
                  }
              })
              print(creature_id, len(data), catalog['assets'][-1]['sha256'])

          catalog['updatedOn'] = '2026-09-14'
          catalog['summary'] = {
              'total': len(catalog['assets']),
              'keep': sum(a['status'] == 'keep' for a in catalog['assets']),
              'provisional': sum(a['status'] == 'provisional' for a in catalog['assets']),
              'remake': sum(a['status'] == 'remake' for a in catalog['assets']),
          }
          assert catalog['summary'] == {'total': 37, 'keep': 37, 'provisional': 0, 'remake': 0}, catalog['summary']
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')
          PY
      - name: Strict source validation and guarded promotion
        run: |
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json
          for id in balloonfish black-grouper doctorfish foureye-butterflyfish princess-parrotfish spotted-moray yellowtail-damselfish; do
            python -m tools.creature_assets promote-source --candidate "$id"
          done
          python -m tools.creature_assets validate --root assets/creatures
      - name: Verify focused runtime closure
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          ids = [
              'balloonfish','black-grouper','doctorfish','foureye-butterflyfish',
              'princess-parrotfish','spotted-moray','yellowtail-damselfish'
          ]
          catalog = json.loads(Path('assets/source/creatures/catalog.json').read_text())
          source = {a['id']: a for a in catalog['assets']}
          expected = {'thumb.webp': (192,192), 'gallery.webp': (512,512), 'hero.webp': (1024,1024)}
          for creature_id in ids:
              root = Path('assets/creatures') / creature_id
              manifest = json.loads((root / 'manifest.json').read_text())
              assert manifest['creatureId'] == creature_id
              assert manifest['source']['sha256'] == source[creature_id]['sha256']
              assert manifest['source']['mode'] == 'opaque-scene'
              assert manifest['artwork']['status'] == 'curated'
              for name, dims in expected.items():
                  with Image.open(root / name) as image:
                      assert image.size == dims, (creature_id, name, image.size)
                      assert image.format == 'WEBP'
              print('runtime verified:', creature_id)
          PY
      - name: Full repository gate
        env:
          POSEIDON_BASE_PATH: /poseidon/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run gate
      - name: Remove temporary finalization workflow
        run: rm .github/workflows/issue33-art-batch-finalize.yml
      - name: Commit accepted catalog and runtime assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures/catalog.json assets/creatures .github/workflows/issue33-art-batch-finalize.yml
          git commit -m 'feat(assets): promote #33 isolated art batch'
          git push origin HEAD:feat/33-art-batch-adpy
