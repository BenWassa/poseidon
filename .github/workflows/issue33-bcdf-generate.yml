name: Issue 33 isolated art batch B/C/D/F

on:
  push:
    branches:
      - feat/33-art-batch-bcdf

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/33-art-batch-bcdf
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Render diagnostic-led candidates
        run: node tools/issue33_batch_bcdf_render.mjs
      - name: Encode immutable 1024 WebP source candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          ids = [
              'bicolor-damselfish',
              'french-grunt',
              'honeycomb-cowfish',
              'lionfish',
              'mutton-snapper',
              'redband-parrotfish',
          ]
          for creature_id in ids:
              src = Path('tmp_issue33_bcdf') / f'{creature_id}.png'
              dst = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              if dst.exists():
                  raise SystemExit(f'refusing to overwrite immutable source candidate: {dst}')
              dst.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as image:
                  image.convert('RGB').save(dst, 'WEBP', quality=90, method=6, exact=True)
              with Image.open(dst) as image:
                  assert image.size == (1024, 1024)
                  assert image.format == 'WEBP'
                  assert 'A' not in image.getbands()
              print(dst, dst.stat().st_size)
          PY
      - name: Remove temporary generation machinery
        run: |
          rm -rf tmp_issue33_bcdf tools/issue33_batch_bcdf_render.mjs .github/workflows/issue33-bcdf-generate.yml
      - name: Commit immutable candidate binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures .github/workflows/issue33-bcdf-generate.yml tools/issue33_batch_bcdf_render.mjs
          git commit -m 'assets: stage isolated #33 source candidates'
          git push origin HEAD:feat/33-art-batch-bcdf
