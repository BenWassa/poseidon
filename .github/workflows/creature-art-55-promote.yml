name: Issue 55 realistic creature promotion

on:
  push:
    branches:
      - art/55-realistic-hd
    paths:
      - 'assets/source/creatures/**/candidate-v*.webp'
      - 'assets/source/creatures/**/candidate-v*.review.json'

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - name: Apply one reviewed replacement to source catalog
        id: review
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t reviews < <(git diff --name-only HEAD^ HEAD -- 'assets/source/creatures/*/candidate-v*.review.json')
          if [ "${#reviews[@]}" -eq 0 ]; then
            echo "No #55 review sidecar in this commit; nothing to promote."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#reviews[@]}" -ne 1 ]; then
            printf 'Expected exactly one review sidecar, found %s\n' "${#reviews[@]}" >&2
            printf '%s\n' "${reviews[@]}" >&2
            exit 1
          fi
          review_file="${reviews[0]}"
          python - "$review_file" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          review_path = pathlib.Path(sys.argv[1])
          review = json.loads(review_path.read_text())
          candidate_id = review_path.parent.name
          candidate_name = review['candidate']
          candidate_path = review_path.parent / candidate_name
          if not candidate_path.is_file():
              raise SystemExit(f'Missing reviewed candidate: {candidate_path}')
          data = candidate_path.read_bytes()

          catalog_path = pathlib.Path('assets/source/creatures/catalog.json')
          catalog = json.loads(catalog_path.read_text())
          match = next((entry for entry in catalog['assets'] if entry['id'] == candidate_id), None)
          if match is None:
              raise SystemExit(f'No catalog entry for {candidate_id}')

          match.update({
              'path': candidate_path.as_posix(),
              'score': review['score'],
              'status': 'keep',
              'identity': review['identity'],
              'ingestMode': 'opaque-scene',
              'qaNote': review['qaNote'],
              'bytes': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'generator': 'ChatGPT image generation',
              'generatedOn': review['generatedOn'],
              'generationBatch': review.get('generationBatch', 'issue-55-realistic-hd'),
              'styleFamily': 'poseidon-sunlit-square-v1',
          })
          match.pop('provenance', None)
          catalog['updatedOn'] = review['generatedOn']
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n')
          pathlib.Path('.issue55-candidate-id').write_text(candidate_id)
          PY
          echo "candidate_id=$(cat .issue55-candidate-id)" >> "$GITHUB_OUTPUT"
          echo "review_file=$review_file" >> "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"
      - name: Validate source catalog
        if: steps.review.outputs.skip != 'true'
        run: python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json
      - name: Promote reviewed source
        if: steps.review.outputs.skip != 'true'
        run: python -m tools.creature_assets promote-source --candidate '${{ steps.review.outputs.candidate_id }}' --force
      - name: Validate runtime assets
        if: steps.review.outputs.skip != 'true'
        run: python -m tools.creature_assets validate --root assets/creatures
      - name: Commit promotion
        if: steps.review.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f '${{ steps.review.outputs.review_file }}' .issue55-candidate-id
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures/catalog.json assets/source/creatures assets/creatures
          git commit -m "assets(#55): promote realistic ${{ steps.review.outputs.candidate_id }}"
          git push
