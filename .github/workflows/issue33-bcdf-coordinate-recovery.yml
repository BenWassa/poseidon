name: Coordinate #33 BCDF recovery

on:
  push:
    branches:
      - feat/33-art-batch-bcdf-coordinated

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/33-art-batch-bcdf-coordinated
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: npx playwright install --with-deps chromium

      - name: Sync current main before catalog mutation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main

      - name: Register reviewed immutable source candidates
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          reviewed = [
              ('bicolor-damselfish', 'Bicolor damselfish', 8.3, 'Adult bicolor morph reads clearly at card scale: deep damselfish body with a black anterior half and sharply contrasting white posterior half/tail; no blue/yellow damsel palette leakage.'),
              ('french-grunt', 'French grunt', 8.5, 'Pale grunt body carries a dense yellow stripe field with lower stripes turning diagonal and consistently yellow fins; avoids the dark-fin treatment that would suggest bluestriped grunt.'),
              ('honeycomb-cowfish', 'Honeycomb cowfish', 8.8, 'Rigid thick oblong boxfish carapace, explicit dark honeycomb/hexagonal network with pale outlines, horn-like supraorbital spines and a lower rear carapace spine make Acanthostracion polygonium unambiguous.'),
              ('lionfish', 'Lionfish', 8.8, 'Red/cream zebra banding, very long separate dorsal spines and pectoral rays, plus spotted soft fins/tail preserve Pterois volitans identity and reject a short-finned generic scorpionfish silhouette.'),
              ('mutton-snapper', 'Mutton snapper', 8.6, 'Snapper silhouette retains red iris and reddish fins, multiple blue cheek lines below the eye and the small dark flank spot above the lateral line beneath the soft dorsal region.'),
              ('redband-parrotfish', 'Redband parrotfish', 8.6, 'Terminal-phase presentation preserves parrotfish beak, red iris and red under-eye stripe, yellow-and-black spot above the pectoral base, and black tail tips; avoids a generic green parrotfish substitution.'),
          ]
          path = Path('assets/source/creatures/catalog.json')
          catalog = json.loads(path.read_text())
          ids = {entry['id'] for entry in catalog['assets']}
          collisions = [creature_id for creature_id, *_ in reviewed if creature_id in ids]
          if collisions:
              raise SystemExit(f'refusing catalog collision: {collisions}')
          for creature_id, name, score, note in reviewed:
              candidate = Path('assets/source/creatures') / creature_id / 'candidate-v1.webp'
              data = candidate.read_bytes()
              catalog['assets'].append({
                  'id': creature_id,
                  'creatureId': creature_id,
                  'name': name,
                  'path': candidate.as_posix(),
                  'score': score,
                  'status': 'keep',
                  'identity': 'high',
                  'ingestMode': 'opaque-scene',
                  'qaNote': note,
                  'generator': 'ChatGPT procedural SVG renderer',
                  'generatedOn': '2026-09-14',
                  'generationBatch': 'issue-33-isolated-batch-bcdf',
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          catalog['updatedOn'] = '2026-09-14'
          catalog['summary'] = {
              'total': len(catalog['assets']),
              'keep': sum(a['status'] == 'keep' for a in catalog['assets']),
              'provisional': sum(a['status'] == 'provisional' for a in catalog['assets']),
              'remake': sum(a['status'] == 'remake' for a in catalog['assets']),
          }
          path.write_text(json.dumps(catalog, indent=2) + '\n')
          print(catalog['summary'])
          PY
          python -m tools.creature_assets validate-source --catalog assets/source/creatures/catalog.json

      - name: Guarded promotion
        run: |
          for id in bicolor-damselfish french-grunt honeycomb-cowfish lionfish mutton-snapper redband-parrotfish; do
            python -m tools.creature_assets promote-source --candidate "$id" --force
          done
          python -m tools.creature_assets validate --root assets/creatures
          node apps/web/scripts/sync-assets.mjs

      - name: Bounded rendered verification
        run: |
          cat > tools/issue33_bcdf_coordinate_verify.mjs <<'JS'
          import { spawn } from 'node:child_process';
          import { chromium } from 'playwright';
          import { launchOptions } from './chromium.mjs';

          const species = [
            ['bicolor-damselfish', 'Bicolor damselfish'],
            ['french-grunt', 'French grunt'],
            ['honeycomb-cowfish', 'Honeycomb cowfish'],
            ['lionfish', 'Lionfish'],
            ['mutton-snapper', 'Mutton snapper'],
            ['redband-parrotfish', 'Redband parrotfish'],
          ];
          const port = 4176;
          const origin = `http://127.0.0.1:${port}`;
          const route = (path) => `${origin}/?mock=3#${path}`;
          const dev = spawn('npm', ['run','dev','--workspace','@poseidon/web','--','--host','127.0.0.1','--port',String(port),'--strictPort'], { stdio:['ignore','pipe','pipe'], env:process.env });
          dev.stdout.pipe(process.stdout); dev.stderr.pipe(process.stderr);
          async function ready() {
            const end = Date.now()+30000;
            while (Date.now()<end) {
              try { if ((await fetch(origin)).ok) return; } catch {}
              await new Promise(r=>setTimeout(r,250));
            }
            throw new Error('dev server timeout');
          }
          async function loaded(page, selector, label) {
            const loc = page.locator(selector).first();
            await loc.waitFor({state:'visible', timeout:10000});
            const deadline = Date.now() + 10000;
            while (Date.now() < deadline) {
              const state = await loc.evaluate((node) => ({
                complete: node instanceof HTMLImageElement && node.complete,
                width: node instanceof HTMLImageElement ? node.naturalWidth : 0,
                height: node instanceof HTMLImageElement ? node.naturalHeight : 0,
              }));
              if (state.complete && state.width > 0 && state.height > 0) {
                console.log('[bcdf render]', label, await loc.getAttribute('src'));
                return;
              }
              await page.waitForTimeout(250);
            }
            throw new Error(`${label}: image did not decode`);
          }
          await ready();
          const browser = await chromium.launch(launchOptions());
          try {
            const page = await browser.newPage({ viewport:{width:412,height:915}, deviceScaleFactor:2.6, isMobile:true, hasTouch:true });
            page.setDefaultTimeout(15000); page.setDefaultNavigationTimeout(20000);
            for (const [id] of species) {
              await page.goto(route(`/collection/${id}`), {waitUntil:'domcontentloaded'});
              await loaded(page, `img[data-testid="creature-artwork"][src*="/creatures/${id}/hero.webp"]`, `detail ${id}`);
            }
            await page.goto(route('/log'), {waitUntil:'domcontentloaded'});
            await page.getByRole('button', {name:'Cozumel'}).first().click();
            await page.getByLabel('Dive site').fill('Issue 33 coordinated render check');
            await page.getByRole('button', {name:'Continue'}).click();
            await page.getByLabel('Max depth').fill('18');
            await page.getByLabel('Duration').fill('42');
            await page.getByRole('button', {name:'Choose creatures'}).click();
            const search = page.getByLabel('Search creatures');
            for (const [id,name] of species) {
              await search.fill(name);
              const button = page.getByRole('button', {name:new RegExp(name,'i')}).first();
              await button.waitFor({state:'visible'});
              await loaded(page, `button:has-text("${name}") img[data-testid="creature-artwork"][src*="/creatures/${id}/gallery.webp"]`, `log ${id}`);
              await search.fill('');
            }
          } finally {
            await browser.close();
            dev.kill('SIGTERM');
          }
          JS
          timeout 180s node tools/issue33_bcdf_coordinate_verify.mjs

      - name: Full repository gate
        env:
          POSEIDON_BASE_PATH: /poseidon/
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run gate

      - name: Remove temporary machinery and commit
        run: |
          rm -f .github/workflows/issue33-bcdf-promote.yml tools/issue33_bcdf_verify_render.mjs tools/issue33_bcdf_coordinate_verify.mjs .github/workflows/issue33-bcdf-coordinate-recovery.yml
          git add -A
          git status --short
          git commit -m 'feat(assets): add isolated #33 BCDF art batch'
          git push origin HEAD:feat/33-art-batch-bcdf-coordinated
