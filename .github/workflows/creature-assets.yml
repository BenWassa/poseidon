name: Creature asset pipeline

on:
  pull_request:
    paths:
      - 'tools/creature_assets/**'
      - 'assets/creatures/**'
      - 'docs/ASSET_PIPELINE.md'
      - '.github/workflows/creature-assets.yml'
  push:
    branches: [main]
    paths:
      - 'tools/creature_assets/**'
      - 'assets/creatures/**'
      - 'docs/ASSET_PIPELINE.md'
      - '.github/workflows/creature-assets.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: python -m unittest discover -s tools/creature_assets/tests -v
      - run: python -m tools.creature_assets validate --root assets/creatures
