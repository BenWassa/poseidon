name: Reconcile release closeout

on:
  push:
    branches:
      - docs/reconcile-release-closeout

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-release-closeout
          fetch-depth: 0
      - name: Reconcile durable release status
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/PROJECT_STATUS.md')
          s = p.read_text()
          s = s.replace('Last reconciled: **2026-09-12**', 'Last reconciled: **2026-09-14**')
          s = s.replace('`da305c06b76c0c2d26a2dcd5521ab0fbe79d1eba`', '`63a601a36c0d92a11dfea2c1239c4866daed16ae`')
          s = s.replace('### #26 — versioning/release system\n\nRoot/package version synchronization, embedded product/Git SHA, `CHANGELOG.md`, Release Please configuration and workflow are in place. The deliberate bootstrap release remains owner-controlled.', '### #26 — versioning/release system — complete\n\nRoot/package version synchronization, embedded product/Git SHA, `CHANGELOG.md`, Release Please configuration and workflow are in place. The first named release, **Poseidon 0.1.0**, was published on 2026-09-13 from `63a601a`. Release Please uses the component-aware tag `poseidon-v0.1.0`; future named releases follow the same convention.')
          s = s.replace('4. perform/record #14 physical Pixel acceptance when desired;\n5. close parent/status items as appropriate;\n6. cut the deliberate bootstrap release when the product state is ready.', '4. perform/record #14 physical Pixel acceptance when desired;\n5. close parent/status items as appropriate.')
          p.write_text(s)

          p = Path('docs/VERSIONING_AND_RELEASES.md')
          s = p.read_text()
          s = s.replace('Status: **infrastructure implemented; bootstrap release pending** (see `docs/PROJECT_STATUS.md`)', 'Status: **implemented and bootstrapped**. The first named release, Poseidon 0.1.0, was published on 2026-09-13 from `63a601a`.')
          s = s.replace('The corresponding Git tag and GitHub Release are:\n\n```text\nv0.3.0\n```', 'Release Please uses the repository component name in the corresponding Git tag:\n\n```text\nposeidon-v0.3.0\n```')
          s = s.replace('- an immutable `vX.Y.Z` Git tag;', '- an immutable `poseidon-vX.Y.Z` Git tag;')
          s = s.replace('5. merging the release PR creates the `vX.Y.Z` tag and GitHub Release;', '5. merging the release PR creates the `poseidon-vX.Y.Z` tag and GitHub Release;')
          start = '## Release bootstrap\n\nPoseidon has no existing GitHub Releases at the time this policy is written.\n\nBootstrap rules:\n\n1. Land #26 release/versioning infrastructure without creating a tag as an incidental CI side effect.\n2. Keep `0.1.0` as the starting declared product version unless implementation discovers a concrete technical conflict.\n3. Establish one known-green baseline after the infrastructure is merged.\n4. Create the first `v0.1.0` GitHub Release intentionally from that baseline.\n5. Do not create fictional historical `v0.x.y` tags for older commits.\n6. Future releases follow the release-PR flow.'
          repl = '## Release bootstrap\n\nBootstrap completed on **2026-09-13**. Release Please created the first named release, **Poseidon 0.1.0**, from commit `63a601a36c0d92a11dfea2c1239c4866daed16ae`. The published tag is `poseidon-v0.1.0`, matching Release Please\'s component-aware repository convention. No fictional historical releases were created. Future releases follow the same reviewable release-PR flow.'
          s = s.replace(start, repl)
          s = s.replace('For every named release:\n\n```text\ntag: vX.Y.Z\nrelease title: Poseidon vX.Y.Z\n```', 'For every named release:\n\n```text\ntag: poseidon-vX.Y.Z\nrelease title: poseidon: vX.Y.Z\n```\n\nThe product version remains plain SemVer (`X.Y.Z`); the `poseidon-` prefix is repository release metadata, not part of the product version.')
          s = s.replace('- the initial release is intentionally bootstrapped rather than retroactively fabricated.', '- the initial release was intentionally bootstrapped rather than retroactively fabricated.')
          p.write_text(s)

          Path('.github/workflows/reconcile-release-closeout.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_STATUS.md docs/VERSIONING_AND_RELEASES.md .github/workflows/reconcile-release-closeout.yml
          git commit -m 'docs: reconcile completed release bootstrap'
          git push origin HEAD:docs/reconcile-release-closeout
