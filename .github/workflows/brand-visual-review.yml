# Temporary visual evidence harness for issue #21. Removed before merge.
name: Sunlit Reef visual review

on:
  push:
    branches: [brand-21-sunlit-reef]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyPoseidonVisualReviewOnly
      VITE_FIREBASE_AUTH_DOMAIN: poseidon-visual-review.invalid
      VITE_FIREBASE_PROJECT_ID: poseidon-visual-review
      VITE_FIREBASE_STORAGE_BUCKET: poseidon-visual-review.invalid
      VITE_FIREBASE_MESSAGING_SENDER_ID: '1234567890'
      VITE_FIREBASE_APP_ID: '1:1234567890:web:poseidonreview'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand-21-sunlit-reef
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production auth surface
        run: npm run build
      - name: Capture signed-out auth surface
        run: |
          mkdir -p tmp/brand-review
          npm run preview --workspace @poseidon/web -- --host 127.0.0.1 --port 4173 >/tmp/poseidon-preview.log 2>&1 &
          PREVIEW_PID=$!
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import { launchOptions } from './tools/chromium.mjs';
          const browser = await chromium.launch(launchOptions());
          const context = await browser.newContext({ viewport: { width: 412, height: 915 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true, reducedMotion: 'reduce' });
          const page = await context.newPage();
          await page.goto('http://127.0.0.1:4173/#/', { waitUntil: 'networkidle' });
          await page.waitForTimeout(700);
          await page.screenshot({ path: 'tmp/brand-review/00-auth-sign-in.jpg', type: 'jpeg', quality: 84 });
          await browser.close();
          NODE
          kill "$PREVIEW_PID" || true
      - name: Build local demo shell for composition review
        run: |
          cat > apps/web/src/main.tsx <<'EOF'
          import { StrictMode } from 'react';
          import { createRoot } from 'react-dom/client';
          import { HashRouter } from 'react-router-dom';

          import { App } from './App';
          import { AuthProvider } from './auth/AuthProvider';
          import { createPoseidonClient } from './data/client';
          import { PoseidonProvider } from './data/provider';
          import './index.css';

          const container = document.getElementById('root');
          if (!container) throw new Error('Poseidon could not find its root element.');
          const client = createPoseidonClient();

          createRoot(container).render(
            <StrictMode>
              <HashRouter>
                <AuthProvider>
                  <PoseidonProvider client={client}>
                    <App />
                  </PoseidonProvider>
                </AuthProvider>
              </HashRouter>
            </StrictMode>,
          );
          EOF
          npm run build
      - name: Capture mobile composition suite
        env:
          POSEIDON_SHOTS: tmp/brand-review
        run: npm run screenshots
      - name: Commit temporary review evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/brand-review
          git commit -m "chore: add temporary Sunlit Reef review evidence"
          git push origin HEAD:brand-21-sunlit-reef
