name: Issue 39 candidate generation

on:
  push:
    branches:
      - feat/39-remake-batch-b

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/39-remake-batch-b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/creature_assets/requirements.txt
      - run: npm ci
      - run: python -m pip install -r tools/creature_assets/requirements.txt
      - run: npx playwright install --with-deps chromium
      - name: Render reviewed biological replacements
        run: node tools/issue39_render.mjs
      - name: Encode immutable 1024 WebP candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          ids = [
              'caribbean-cushion-sea-star',
              'porkfish',
              'queen-conch',
              'caribbean-reef-octopus',
          ]
          for creature_id in ids:
              src = Path('tmp_issue39') / f'{creature_id}.png'
              dst = Path('assets/source/creatures') / creature_id / 'candidate-v2.webp'
              dst.parent.mkdir(parents=True, exist_ok=True)
              with Image.open(src) as image:
                  image.convert('RGB').save(dst, 'WEBP', quality=90, method=6, exact=True)
              with Image.open(dst) as image:
                  assert image.size == (1024, 1024)
                  assert image.format == 'WEBP'
              print(dst, dst.stat().st_size)
          PY
      - name: Remove temporary generation machinery
        run: |
          rm -rf tmp_issue39 tools/issue39_render.mjs .github/workflows/issue39-generate.yml
      - name: Commit candidate binaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/source/creatures .github/workflows/issue39-generate.yml tools/issue39_render.mjs
          git commit -m 'assets: stage #39 reviewed v2 candidates'
          git push origin HEAD:feat/39-remake-batch-b
